version: '3.8'
services:
  postgres:
    image: postgres:18
    container_name: agent_ia_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/database/init:/docker-entrypoint-initdb.d
volumes:
  postgres_data: